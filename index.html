<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary Unit 4 — Interactive Practice</title>
<style>
:root{--ink:#202124;--muted:#666;--line:#d9dde3;--bg:#f4f6f8;--card:#fff;--accent:#374151;--ok:#287a4b;--bad:#b83232}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:980px;margin:auto;padding:28px 18px 55px}
header,.section-card,.quiz-card,.results{background:var(--card);border-radius:18px;box-shadow:0 4px 18px #0000000d}
header{padding:28px;margin-bottom:18px}h1{margin:0 0 8px;font-size:30px}h2{margin-top:0}
.subtitle{color:var(--muted);line-height:1.5;margin:0}
.section-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:20px}
.section-link{padding:15px;border:2px solid var(--line);border-radius:12px;background:#fff;text-align:left;font-size:15px;cursor:pointer}
.section-link:hover{border-color:#7a818b;background:#fafafa}
.section-card{padding:24px;margin-bottom:18px}
.section-card h2{font-size:22px;margin-bottom:7px}.section-card p{color:var(--muted);margin-top:0}
.start{background:var(--accent);color:#fff;border:0;padding:11px 18px;border-radius:9px;font-size:15px;cursor:pointer}
.hidden{display:none!important}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:14px;margin-bottom:13px}
.bar{height:9px;background:#e6e8eb;border-radius:10px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:#5b6470;transition:.25s}
.quiz-card{padding:27px}.question{font-size:21px;line-height:1.45;margin:0 0 20px}.options{display:grid;gap:10px}
.option{width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:11px;background:#fff;font-size:16px;cursor:pointer}
.option:hover:not(:disabled){background:#fafafa;border-color:#7a818b}.option:disabled{cursor:default}
.option.correct{background:#eaf7ef;border-color:var(--ok)}.option.wrong{background:#fff0f0;border-color:var(--bad)}
.feedback{display:none;margin-top:16px;padding:13px;border-radius:10px;line-height:1.45}.feedback.show{display:block}
.feedback.ok{background:#eaf7ef;color:#22543d}.feedback.no{background:#fff0f0;color:#742a2a}
.actions{display:flex;gap:10px;margin-top:17px;flex-wrap:wrap}
.next,.back{border:0;border-radius:9px;padding:11px 18px;font-size:15px;cursor:pointer}.next{background:var(--accent);color:#fff;display:none}.back{background:#eef0f2;color:#222}
.results{text-align:center;padding:32px;display:none}.score{font-size:44px;font-weight:bold;margin:10px}
.small{color:var(--muted)}.restart{background:var(--accent);color:#fff;border:0;padding:11px 18px;border-radius:9px;cursor:pointer}
@media(max-width:600px){h1{font-size:25px}.question{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Vocabulary Unit 4</h1>
<p class="subtitle">Interactive practice for the vocabulary from the two pages. Choose the best answer in each question.</p>
<div class="section-grid" id="menu"></div>
</header>

<div id="quizArea" class="hidden">
<div class="quiz-card">
<div class="topline"><span id="sectionName"></span><span id="counter"></span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<p class="question" id="question"></p>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<div class="actions"><button class="back" id="back">← Categories</button><button class="next" id="next">Next →</button></div>
</div>
</div>

<div class="results" id="results">
<h2>Section complete!</h2><div class="score" id="score"></div><p id="message"></p>
<button class="restart" id="restart">Try this section again</button>
<button class="back" id="resultBack" style="margin-left:8px">Back to categories</button>
</div>
</div>

<script>
const DATA = [{"title": "🏆 Sports — Key People", "intro": "Choose the word that best completes each definition or situation.", "questions": [["A person who trains or teaches people in a sport is a...", ["referee", "coach", "player"], 1, "A coach trains or teaches people."], ["A person who makes sure players follow the rules in a sports game is a...", ["teammate", "referee", "rival"], 1, "A referee makes sure players follow the rules."], ["A person who takes part in a sport is a...", ["coach", "role model", "player"], 2, "A player takes part in a sport."], ["A person, group, team or company that competes with another is a...", ["rival", "coach", "team"], 0, "A rival competes with another person, group or team."], ["A group of players working or playing together to reach a shared goal is a...", ["player", "team", "referee"], 1, "A team works together toward a shared goal."], ["A player who belongs to the same team as you is your...", ["rival", "teammate", "coach"], 1, "A teammate belongs to the same team."], ["A person you admire and whose behaviour or success you try to copy is a...", ["referee", "rival", "role model"], 2, "A role model is someone you admire and try to copy."]]}, {"title": "🤝 Sports — Feelings & Relationships", "intro": "Choose the phrasal verb that best fits the situation.", "questions": [["Losing an important match really ______.", ["cheers me up", "talks it over", "gets me down"], 2, "Get me down = make me feel depressed."], ["My teammates always ______ after a bad match.", ["cheer me up", "get me away", "fall me out"], 0, "Cheer me up = make me feel happier."], ["We had a disagreement after the game, so we decided to ______.", ["get it down", "talk it over", "fall it up"], 1, "Talk it over = discuss the problem."], ["I don't want to ______ my teammate because of a football match.", ["get on with", "fall out with", "cheer up"], 1, "Fall out with someone = have an argument with them."], ["I ______ really well ______ my teammates.", ["talk / over", "fall / out with", "get / on with"], 2, "Get on with someone = have a good relationship with them."], ["After training, sometimes I want to ______ my teammates and have some time alone.", ["get away from", "get down from", "talk over"], 0, "Get away from someone = escape from them."], ["Which expression means 'discuss a problem'?", ["talk it over", "get away from", "get on with"], 0, "Talk it over means discuss the problem."], ["Which expression means 'have a good relationship with someone'?", ["fall out with", "get me down", "get on with"], 2, "Get on with someone means have a good relationship with them."]]}, {"title": "🔗 Adjectives + Prepositions", "intro": "Choose the correct adjective + preposition combination. All the prepositions from the unit are mixed together.", "questions": [["Our new goalkeeper is brilliant ______ saving penalties.", ["about", "at", "of"], 1, "Brilliant at = extremely good at something."], ["I’m a little anxious ______ the selection results.", ["about", "with", "on"], 0, "Anxious about = nervous or worried about something."], ["Mia is afraid ______ speaking in front of a large crowd.", ["at", "to", "of"], 2, "Afraid of = scared of something."], ["The new training app is very popular ______ young athletes.", ["with", "about", "on"], 0, "Popular with = liked by a group of people."], ["Leo is keen ______ learning new swimming techniques.", ["of", "on", "about"], 1, "Keen on = liking or being interested in something."], ["Some people become addicted ______ checking their phones during breaks.", ["with", "of", "to"], 2, "Addicted to = unable to stop doing or using something."], ["I’m hopeless ______ remembering the names of football players.", ["at", "about", "of"], 0, "Hopeless at = terrible at something; no skill at all."], ["The captain was embarrassed ______ forgetting the team meeting.", ["with", "about", "of"], 1, "Embarrassed about = feeling shy or awkward about something."], ["The players were enthusiastic ______ the idea of a weekend tournament.", ["about", "at", "with"], 0, "Enthusiastic about = very excited and interested."], ["We’re really happy ______ the way the team performed.", ["of", "about", "on"], 1, "Happy about = pleased or glad."], ["She felt sad ______ leaving her old teammates.", ["with", "of", "about"], 2, "Sad about = feeling unhappy or upset."], ["Many students are stressed ______ their final exams.", ["about", "with", "of"], 0, "Stressed about = feeling overwhelmed or under pressure."], ["The coach is worried ______ the players’ lack of rest.", ["of", "with", "about"], 2, "Worried about = concerned that something bad might happen."], ["I’m bored ______ doing the same exercise every lesson.", ["about", "of", "at"], 1, "Bored of = tired of something because it is no longer interesting."], ["The substitute player is capable ______ playing in several positions.", ["with", "of", "about"], 1, "Capable of = having the ability to do something."], ["The younger players were frightened ______ the noise from the stadium.", ["about", "of", "with"], 1, "Frightened of = very scared of something."], ["Everyone was proud ______ the team after the final.", ["with", "about", "of"], 2, "Proud of = feeling pleased about your own or someone else’s success."], ["I’m fed up ______ waiting for the match to start.", ["of", "with", "about"], 1, "Fed up with = frustrated or annoyed by something that has gone on too long."], ["My brother is good ______ volleyball, but I prefer swimming.", ["of", "about", "at"], 2, "Good at = skilled at doing something."], ["She’s bad ______ remembering where she leaves her sports bag.", ["at", "with", "of"], 0, "Bad at = not good at doing something."], ["Our PE teacher is very confident and brilliant ______ motivating students.", ["at", "about", "to"], 0, "Brilliant at = extremely good at something."], ["He was embarrassed ______ his poor performance in the trial.", ["of", "on", "about"], 2, "Embarrassed about = feeling shy or awkward about something."], ["The team is capable ______ improving if everyone trains regularly.", ["about", "of", "with"], 1, "Capable of = having the ability to do something."], ["I’m keen ______ trying the new climbing wall at school.", ["on", "of", "to"], 0, "Keen on = liking or being interested in something."]]}, {"title": "🧑 Describing Someone — Personality", "intro": "Choose the adjective that best describes the person.", "questions": [["Someone who likes doing things and has lots of energy is...", ["anxious", "active", "sensible"], 1, "Active = likes doing things and has lots of energy."], ["Someone who wants to achieve a lot is...", ["outgoing", "ambitious", "creative"], 1, "Ambitious = wants to achieve a lot."], ["Someone who is worried or nervous is...", ["active", "confident", "anxious"], 2, "Anxious = worried or nervous."], ["Someone who wants to win is...", ["competitive", "creative", "sensible"], 0, "Competitive = wants to win."], ["Someone who believes in themselves is...", ["anxious", "confident", "outgoing"], 1, "Confident = believes in themselves."], ["Someone who has lots of new ideas is...", ["creative", "competitive", "ambitious"], 0, "Creative = has lots of new ideas."], ["Someone who is friendly and enjoys meeting people is...", ["sensible", "anxious", "outgoing"], 2, "Outgoing = friendly and enjoys meeting people."], ["Someone who makes good decisions is...", ["confident", "competitive", "sensible"], 2, "Sensible = makes good decisions."]]}, {"title": "⚽ How Should a Good Player Be?", "intro": "Think about personality in a sports context.", "questions": [["A good player stays calm and believes they can perform well. They are...", ["confident", "hopeless", "anxious"], 0, "Confident players believe in themselves."], ["A player who wants to improve and achieve a lot is...", ["bored", "frightened", "ambitious"], 2, "Ambitious = wants to achieve a lot."], ["A player who always wants to win is...", ["competitive", "sad", "embarrassed"], 0, "Competitive = wants to win."], ["A player who makes careful, good decisions is...", ["aggressive", "anxious", "sensible"], 2, "Sensible = makes good decisions."], ["A player who brings new ideas to training is...", ["creative", "hopeless", "anxious"], 0, "Creative = has lots of new ideas."]]}, {"title": "🔤 Word Formation — Adjectives", "intro": "Choose the correct adjective formed from the word in brackets.", "questions": [["She is very ______. She often asks questions because she wants to know more. (curiosity)", ["curiously", "curiosity", "curious"], 2, "curiosity → curious"], ["He is known for his ______. (generosity)", ["generosity", "generously", "generous"], 2, "generosity → generous"], ["The player became ______ during the match. (aggression)", ["aggressive", "aggression", "aggressively"], 0, "aggression → aggressive"], ["She is very ______ to other people's feelings. (sense)", ["sensitive", "sense", "sensitively"], 0, "sense → sensitive"], ["You are ______ of achieving your goal. (depend)", ["dependent", "depend", "dependently"], 0, "depend → dependent"], ["A good referee needs to be ______. (patience)", ["patiently", "patient", "patience"], 1, "patience → patient"]]}, {"title": "🚫 Word Formation — Negative Prefixes", "intro": "Choose the correct negative adjective.", "questions": [["The opposite of pleasant is...", ["inpleasant", "displeasant", "unpleasant"], 2, "pleasant → unpleasant"], ["The opposite of logical is...", ["unlogical", "dislogical", "illogical"], 2, "logical → illogical"], ["The opposite of possible is...", ["unpossible", "inpossible", "impossible"], 2, "possible → impossible"], ["The opposite of decisive is...", ["irdecisive", "indecisive", "undecisive"], 1, "decisive → indecisive"], ["The opposite of responsible is...", ["irresponsible", "inresponsible", "unresponsible"], 0, "responsible → irresponsible"], ["The opposite of obedient is...", ["inobedient", "disobedient", "unobedient"], 1, "obedient → disobedient"]]}, {"title": "🧠 Final Mixed Review", "intro": "Everything from the unit can appear here.", "questions": [["The person who makes sure players follow the rules is the...", ["referee", "teammate", "rival"], 0, "Referee = person who makes sure players follow the rules."], ["I had an argument with my teammate, but we decided to ______.", ["talk it over", "get me down", "get away from"], 0, "Talk it over = discuss the problem."], ["She's very ______ football. She scores goals easily.", ["good at", "good about", "good of"], 0, "Good at describes skill or ability."], ["I'm ______ the result because we lost.", ["sad of", "sad about", "sad with"], 1, "Sad about describes the reason for a feeling."], ["He's ______ his team after they won the tournament.", ["proud with", "proud of", "proud about"], 1, "Proud of = feeling pleased about success."], ["A person who wants to win is...", ["competitive", "outgoing", "sensible"], 0, "Competitive = wants to win."], ["aggression → ...", ["aggressive", "aggressious", "aggressent"], 0, "aggression → aggressive"], ["responsible → ...", ["inresponsible", "unresponsible", "irresponsible"], 2, "responsible → irresponsible"]]}];
let sec=0, q=0, score=0, answered=false;
const menu=document.getElementById('menu'), quizArea=document.getElementById('quizArea'), results=document.getElementById('results');
const sectionName=document.getElementById('sectionName'), counter=document.getElementById('counter'), fill=document.getElementById('fill');
const question=document.getElementById('question'), options=document.getElementById('options'), feedback=document.getElementById('feedback');
const next=document.getElementById('next'), back=document.getElementById('back');

DATA.forEach((s,i)=>{
 const b=document.createElement('button'); b.className='section-link'; b.textContent=s.title;
 b.onclick=()=>startSection(i); menu.appendChild(b);
});

function startSection(i){
 sec=i;q=0;score=0;results.style.display='none';quizArea.classList.remove('hidden');load();
 window.scrollTo({top:0,behavior:'smooth'});
}
function load(){
 const s=DATA[sec], item=s.questions[q]; answered=false;
 sectionName.textContent=s.title; counter.textContent=`Question ${q+1} of ${s.questions.length}`;
 fill.style.width=(q/s.questions.length*100)+'%'; question.textContent=item[0]; options.innerHTML='';
 feedback.className='feedback'; feedback.textContent=''; next.style.display='none';
 item[1].forEach((text,i)=>{const b=document.createElement('button');b.className='option';b.textContent=text;b.onclick=()=>answer(b,i);options.appendChild(b)});
}
function answer(btn,i){
 if(answered)return;answered=true;const item=DATA[sec].questions[q];
 document.querySelectorAll('.option').forEach(b=>b.disabled=true);
 if(i===item[2]){score++;btn.classList.add('correct');feedback.className='feedback show ok';feedback.innerHTML='<b>Correct!</b> '+item[3]}
 else{btn.classList.add('wrong');document.querySelectorAll('.option')[item[2]].classList.add('correct');feedback.className='feedback show no';feedback.innerHTML='<b>Not quite.</b> The correct answer is <b>'+item[1][item[2]]+'</b>. '+item[3]}
 next.style.display='inline-block';fill.style.width=((q+1)/DATA[sec].questions.length*100)+'%';
}
next.onclick=()=>{q++;if(q<DATA[sec].questions.length)load();else showResults()};
function showResults(){
 quizArea.classList.add('hidden');results.style.display='block';
 document.getElementById('score').textContent=`${score} / ${DATA[sec].questions.length}`;
 const p=score/DATA[sec].questions.length*100;
 document.getElementById('message').textContent=p===100?'Excellent! Perfect score.':p>=80?'Great work!':p>=60?'Good job! Review the vocabulary you missed and try again.':'Review this category and try again.';
 window.scrollTo({top:0,behavior:'smooth'});
}
function backToMenu(){quizArea.classList.add('hidden');results.style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
back.onclick=backToMenu;document.getElementById('resultBack').onclick=backToMenu;
document.getElementById('restart').onclick=()=>{results.style.display='none';quizArea.classList.remove('hidden');q=0;score=0;load()};
</script>
</body>
</html>
